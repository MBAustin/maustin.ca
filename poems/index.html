<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What We Take From the Sea</title>
  <meta name="description" content="Recorded poems.">
  <style>
    :root {
      --bg: #f7f4ee;
      --fg: #22201c;
      --muted: #6f6a60;
      --line: #e2ddd2;
      --card: #fffdf9;
      --hover: #f1ece3;
      --accent: #8a4b2a;
      --accent-fg: #ffffff;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161513;
        --fg: #ece8e1;
        --muted: #9a948a;
        --line: #2e2b27;
        --card: #1e1c19;
        --hover: #26231f;
        --accent: #d9946b;
        --accent-fg: #161513;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--serif);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 56px 20px 80px;
    }
    h1 {
      font-weight: normal;
      font-size: 2.4rem;
      letter-spacing: 0.01em;
      margin: 0 0 32px;
      text-wrap: balance;
    }
    h1.wrapped { text-align: center; }

    /* List */
    .list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .item { border-bottom: 1px solid var(--line); }
    .item:first-child { border-top: 1px solid var(--line); }
    .head {
      width: 100%;
      display: grid;
      grid-template-columns: 2.2em 1fr auto;
      align-items: baseline;
      gap: 8px;
      text-align: left;
      padding: 14px 12px;
      background: none;
      border: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .head:hover { background: var(--hover); }
    .head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .num {
      font-family: var(--sans);
      font-size: 0.8rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .title { font-size: 1.12rem; }
    .note {
      display: block;
      font-size: 0.92rem;
      font-style: italic;
      color: var(--muted);
    }
    .dur {
      font-family: var(--sans);
      font-size: 0.8rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .item.open .title,
    .item.open .num { color: var(--accent); }
    .empty {
      color: var(--muted);
      font-style: italic;
    }

    /* Fold-out player */
    .panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.22s ease;
    }
    .item.open .panel { grid-template-rows: 1fr; }
    .panel-inner { overflow: hidden; min-height: 0; }
    .controls {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 4px 12px 18px;
    }
    .btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      padding: 0;
      background: var(--accent);
      color: var(--accent-fg);
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn svg { width: 24px; height: 24px; fill: currentColor; }
    .btn .icon-pause { display: none; }
    .item.playing .btn .icon-play { display: none; }
    .item.playing .btn .icon-pause { display: block; }
    .seek-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .seek {
      width: 100%;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .times {
      display: flex;
      justify-content: space-between;
      font-family: var(--sans);
      font-size: 0.75rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    @media (prefers-reduced-motion: reduce) {
      .panel { transition: none; }
    }
    @media (max-width: 480px) {
      main { padding-top: 36px; }
      h1 { font-size: 2rem; }
      .controls { gap: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>What We Take From the Sea</h1>

    <ol class="list" id="list"></ol>
    <p class="empty" id="empty" hidden>No recordings yet.</p>
    <audio id="audio" preload="metadata"></audio>
  </main>

  <script src="recordings.js"></script>
  <script>
    (function () {
      var recordings = window.RECORDINGS || [];
      var audio = document.getElementById('audio');
      var listEl = document.getElementById('list');
      var items = [];
      var current = -1;
      var seeking = false;

      var ICONS =
        '<svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>' +
        '<svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

      function fmt(s) {
        if (!isFinite(s) || s < 0) return '0:00';
        s = Math.floor(s);
        var m = Math.floor(s / 60);
        var sec = s % 60;
        return m + ':' + (sec < 10 ? '0' : '') + sec;
      }

      function slug(t) {
        return t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      }

      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }

      function render() {
        if (!recordings.length) {
          document.getElementById('empty').hidden = false;
          return;
        }
        recordings.forEach(function (r, i) {
          var li = el('li', 'item');

          var head = el('button', 'head');
          head.type = 'button';
          head.id = 'head-' + i;
          head.setAttribute('aria-expanded', 'false');
          head.setAttribute('aria-controls', 'panel-' + i);
          var title = el('span', 'title', r.title);
          if (r.note) title.appendChild(el('span', 'note', r.note));
          var dur = el('span', 'dur');
          head.append(el('span', 'num', (i + 1 < 10 ? '0' : '') + (i + 1)), title, dur);

          var panel = el('div', 'panel');
          panel.id = 'panel-' + i;
          panel.setAttribute('role', 'region');
          panel.setAttribute('aria-labelledby', 'head-' + i);
          panel.inert = true;
          var inner = el('div', 'panel-inner');
          var controls = el('div', 'controls');
          var btn = el('button', 'btn');
          btn.type = 'button';
          btn.setAttribute('aria-label', 'Play');
          btn.innerHTML = ICONS;
          var seekWrap = el('div', 'seek-wrap');
          var seek = el('input', 'seek');
          seek.type = 'range';
          seek.min = 0;
          seek.max = 0;
          seek.step = 0.1;
          seek.value = 0;
          seek.setAttribute('aria-label', 'Seek: ' + r.title);
          var times = el('div', 'times');
          var cur = el('span', null, '0:00');
          var total = el('span', null, '0:00');
          times.append(cur, total);
          seekWrap.append(seek, times);
          controls.append(btn, seekWrap);
          inner.appendChild(controls);
          panel.appendChild(inner);

          li.append(head, panel);
          listEl.appendChild(li);

          items.push({ li: li, head: head, panel: panel, btn: btn, seek: seek, cur: cur, total: total });

          head.addEventListener('click', function () {
            if (i === current) close(); else { open(i); toggle(); }
          });
          btn.addEventListener('click', toggle);
          seek.addEventListener('input', function () {
            seeking = true;
            cur.textContent = fmt(seek.value);
          });
          seek.addEventListener('change', function () {
            if (i === current) audio.currentTime = seek.value;
            seeking = false;
          });

          // Fill in each duration from the file's metadata.
          var probe = new Audio();
          probe.preload = 'metadata';
          probe.addEventListener('loadedmetadata', function () {
            dur.textContent = fmt(probe.duration);
            total.textContent = fmt(probe.duration);
            seek.max = probe.duration;
          });
          probe.src = r.file;
        });
      }

      function collapse(i) {
        var it = items[i];
        it.li.classList.remove('open', 'playing');
        it.btn.setAttribute('aria-label', 'Play');
        it.head.setAttribute('aria-expanded', 'false');
        it.panel.inert = true;
      }

      function open(i) {
        audio.pause();
        if (current >= 0) collapse(current);
        current = i;
        var r = recordings[i];
        var it = items[i];
        audio.src = r.file;
        it.seek.value = 0;
        it.cur.textContent = '0:00';
        it.li.classList.add('open');
        it.head.setAttribute('aria-expanded', 'true');
        it.panel.inert = false;
        history.replaceState(null, '', '#' + slug(r.title));
        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({ title: r.title, artist: 'maustin.ca' });
        }
      }

      function close() {
        if (current < 0) return;
        audio.pause();
        collapse(current);
        current = -1;
        history.replaceState(null, '', location.pathname);
      }

      function toggle() {
        if (current < 0) return;
        if (audio.paused) {
          var p = audio.play();
          if (p && p.catch) p.catch(function () {});
        } else {
          audio.pause();
        }
      }

      // The play/pause icon follows the audio element's real state.
      function syncPlaying() {
        var playing = !audio.paused && !audio.ended;
        items.forEach(function (it, j) {
          var on = playing && j === current;
          it.li.classList.toggle('playing', on);
          it.btn.setAttribute('aria-label', on ? 'Pause' : 'Play');
        });
      }

      audio.addEventListener('play', syncPlaying);
      audio.addEventListener('playing', syncPlaying);
      audio.addEventListener('pause', syncPlaying);
      audio.addEventListener('ended', syncPlaying);
      audio.addEventListener('loadedmetadata', function () {
        if (current < 0) return;
        items[current].seek.max = audio.duration;
        items[current].total.textContent = fmt(audio.duration);
      });
      audio.addEventListener('timeupdate', function () {
        if (seeking || current < 0) return;
        items[current].seek.value = audio.currentTime;
        items[current].cur.textContent = fmt(audio.currentTime);
      });

      // Space toggles playback unless a control has focus.
      document.addEventListener('keydown', function (e) {
        if (e.code !== 'Space' || current < 0) return;
        var tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'BUTTON' || tag === 'INPUT') return;
        e.preventDefault();
        toggle();
      });

      if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', function () { if (audio.paused) toggle(); });
        navigator.mediaSession.setActionHandler('pause', function () { audio.pause(); });
      }

      // Center the heading only when it wraps onto more than one line.
      var h1 = document.querySelector('h1');
      function checkWrap() {
        var lh = parseFloat(getComputedStyle(h1).lineHeight);
        h1.classList.toggle('wrapped', h1.getBoundingClientRect().height > lh * 1.5);
      }
      checkWrap();
      window.addEventListener('resize', checkWrap);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(checkWrap);

      render();
      // A link like maustin.ca/poems/#poem-title opens with that poem's player unfolded.
      var h = decodeURIComponent(location.hash.slice(1));
      recordings.forEach(function (r, i) { if (h && slug(r.title) === h) open(i); });
    })();
  </script>
</body>
</html>
