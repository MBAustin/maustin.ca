<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What We Take From the Sea</title>
  <meta name="description" content="Recorded poems.">
  <style>
    :root {
      --bg: #f7f4ee;
      --fg: #22201c;
      --muted: #6f6a60;
      --line: #e2ddd2;
      --card: #fffdf9;
      --hover: #f1ece3;
      --accent: #8a4b2a;
      --accent-fg: #ffffff;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161513;
        --fg: #ece8e1;
        --muted: #9a948a;
        --line: #2e2b27;
        --card: #1e1c19;
        --hover: #26231f;
        --accent: #d9946b;
        --accent-fg: #161513;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--serif);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 56px 20px 80px;
    }
    h1 {
      font-weight: normal;
      font-size: 2.4rem;
      letter-spacing: 0.01em;
      margin: 0 0 32px;
    }
    .sub {
      color: var(--muted);
      font-style: italic;
      margin: 0 0 36px;
    }

    /* Player */
    .player {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 22px 18px;
      position: sticky;
      top: 12px;
      z-index: 1;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
    }
    .now-label {
      font-family: var(--sans);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin: 0 0 4px;
    }
    .now-title {
      font-size: 1.35rem;
      margin: 0 0 16px;
      min-height: 1.5em;
      overflow-wrap: anywhere;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .btn {
      appearance: none;
      border: 0;
      background: none;
      color: var(--fg);
      cursor: pointer;
      padding: 6px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .btn:hover { background: var(--hover); }
    .btn:disabled { opacity: 0.35; cursor: default; background: none; }
    .btn svg { width: 22px; height: 22px; fill: currentColor; }
    .btn.play {
      width: 52px;
      height: 52px;
      background: var(--accent);
      color: var(--accent-fg);
    }
    .btn.play:hover { filter: brightness(1.08); background: var(--accent); }
    .btn.play svg { width: 26px; height: 26px; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .seek-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .seek {
      width: 100%;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .times {
      display: flex;
      justify-content: space-between;
      font-family: var(--sans);
      font-size: 0.75rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* List */
    .list {
      list-style: none;
      margin: 28px 0 0;
      padding: 0;
    }
    .item button {
      width: 100%;
      display: grid;
      grid-template-columns: 2.2em 1fr auto;
      align-items: baseline;
      gap: 8px;
      text-align: left;
      padding: 14px 12px;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--line);
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .item:first-child button { border-top: 1px solid var(--line); }
    .item button:hover { background: var(--hover); }
    .item button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .num {
      font-family: var(--sans);
      font-size: 0.8rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .title { font-size: 1.12rem; }
    .note {
      display: block;
      font-size: 0.92rem;
      font-style: italic;
      color: var(--muted);
    }
    .dur {
      font-family: var(--sans);
      font-size: 0.8rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .item.current .title,
    .item.current .num { color: var(--accent); }
    .empty {
      color: var(--muted);
      font-style: italic;
      margin-top: 28px;
    }

    @media (max-width: 480px) {
      main { padding-top: 36px; }
      h1 { font-size: 2rem; }
      .player { padding: 18px 16px 14px; }
      .controls { gap: 8px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>What We Take From the Sea</h1>

    <section class="player" aria-label="Audio player">
      <p class="now-label">Now playing</p>
      <p class="now-title" id="now-title">&nbsp;</p>
      <div class="controls">
        <button class="btn" id="prev" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg>
        </button>
        <button class="btn play" id="play" aria-label="Play">
          <svg viewBox="0 0 24 24" id="icon-play"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" id="icon-pause" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button class="btn" id="next" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
        <div class="seek-wrap">
          <input class="seek" id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek">
          <div class="times"><span id="cur">0:00</span><span id="total">0:00</span></div>
        </div>
      </div>
      <audio id="audio" preload="metadata"></audio>
    </section>

    <ol class="list" id="list"></ol>
    <p class="empty" id="empty" hidden>No recordings yet.</p>

  </main>

  <script src="recordings.js"></script>
  <script>
    (function () {
      var recordings = window.RECORDINGS || [];
      var audio = document.getElementById('audio');
      var listEl = document.getElementById('list');
      var nowTitle = document.getElementById('now-title');
      var playBtn = document.getElementById('play');
      var prevBtn = document.getElementById('prev');
      var nextBtn = document.getElementById('next');
      var seek = document.getElementById('seek');
      var curEl = document.getElementById('cur');
      var totalEl = document.getElementById('total');
      var iconPlay = document.getElementById('icon-play');
      var iconPause = document.getElementById('icon-pause');
      var current = -1;
      var seeking = false;

      function fmt(s) {
        if (!isFinite(s) || s < 0) return '0:00';
        s = Math.floor(s);
        var m = Math.floor(s / 60);
        var sec = s % 60;
        return m + ':' + (sec < 10 ? '0' : '') + sec;
      }

      function slug(t) {
        return t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      }

      function render() {
        if (!recordings.length) {
          document.getElementById('empty').hidden = false;
          document.querySelector('.player').hidden = true;
          return;
        }
        recordings.forEach(function (r, i) {
          var li = document.createElement('li');
          li.className = 'item';
          var b = document.createElement('button');
          b.type = 'button';

          var num = document.createElement('span');
          num.className = 'num';
          num.textContent = (i + 1 < 10 ? '0' : '') + (i + 1);

          var title = document.createElement('span');
          title.className = 'title';
          title.textContent = r.title;
          if (r.note) {
            var note = document.createElement('span');
            note.className = 'note';
            note.textContent = r.note;
            title.appendChild(note);
          }

          var dur = document.createElement('span');
          dur.className = 'dur';
          b.append(num, title, dur);
          b.addEventListener('click', function () {
            if (i === current) toggle();
            else { load(i); audio.play(); }
          });
          li.appendChild(b);
          listEl.appendChild(li);

          // Fill in each duration from the file's metadata.
          var probe = new Audio();
          probe.preload = 'metadata';
          probe.addEventListener('loadedmetadata', function () { dur.textContent = fmt(probe.duration); });
          probe.src = r.file;
        });
      }

      function load(i) {
        current = i;
        var r = recordings[i];
        audio.src = r.file;
        nowTitle.textContent = r.title;
        seek.value = 0;
        curEl.textContent = '0:00';
        totalEl.textContent = '0:00';
        Array.prototype.forEach.call(listEl.children, function (li, j) {
          li.classList.toggle('current', j === i);
          li.firstChild.setAttribute('aria-current', j === i ? 'true' : 'false');
        });
        prevBtn.disabled = i === 0;
        nextBtn.disabled = i === recordings.length - 1;
        history.replaceState(null, '', '#' + slug(r.title));
        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({ title: r.title, artist: 'maustin.ca' });
        }
      }

      function toggle() {
        if (current < 0) load(0);
        if (audio.paused) audio.play(); else audio.pause();
      }

      function go(delta) {
        var i = current + delta;
        if (i < 0 || i >= recordings.length) return;
        var wasPlaying = !audio.paused;
        load(i);
        if (wasPlaying) audio.play();
      }

      playBtn.addEventListener('click', toggle);
      prevBtn.addEventListener('click', function () { go(-1); });
      nextBtn.addEventListener('click', function () { go(1); });

      audio.addEventListener('play', function () {
        iconPlay.hidden = true; iconPause.hidden = false;
        playBtn.setAttribute('aria-label', 'Pause');
      });
      audio.addEventListener('pause', function () {
        iconPlay.hidden = false; iconPause.hidden = true;
        playBtn.setAttribute('aria-label', 'Play');
      });
      audio.addEventListener('loadedmetadata', function () {
        seek.max = audio.duration;
        totalEl.textContent = fmt(audio.duration);
      });
      audio.addEventListener('timeupdate', function () {
        if (seeking) return;
        seek.value = audio.currentTime;
        curEl.textContent = fmt(audio.currentTime);
      });
      audio.addEventListener('ended', function () {
        if (current < recordings.length - 1) { load(current + 1); audio.play(); }
      });

      seek.addEventListener('input', function () {
        seeking = true;
        curEl.textContent = fmt(seek.value);
      });
      seek.addEventListener('change', function () {
        audio.currentTime = seek.value;
        seeking = false;
      });

      // Space toggles playback unless a control has focus.
      document.addEventListener('keydown', function (e) {
        if (e.code !== 'Space') return;
        var tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'BUTTON' || tag === 'INPUT') return;
        e.preventDefault();
        toggle();
      });

      if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', function () { audio.play(); });
        navigator.mediaSession.setActionHandler('pause', function () { audio.pause(); });
        navigator.mediaSession.setActionHandler('previoustrack', function () { go(-1); });
        navigator.mediaSession.setActionHandler('nexttrack', function () { go(1); });
      }

      render();
      if (recordings.length) {
        // A link like maustin.ca/poems/#poem-title opens with that poem selected.
        var fromHash = -1;
        var h = decodeURIComponent(location.hash.slice(1));
        recordings.forEach(function (r, i) { if (slug(r.title) === h) fromHash = i; });
        load(fromHash >= 0 ? fromHash : 0);
        if (fromHash < 0) history.replaceState(null, '', location.pathname);
      }
    })();
  </script>
</body>
</html>
